name: Publish web container image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-web-image.yml
      - web/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-web-container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish codex-usage-web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/codex-usage-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VITE_API_BASE_URL=https://codex-usage-api.seongmin.dev
          cache-from: type=gha,scope=codex-usage-web-arm64
          cache-to: type=gha,mode=max,scope=codex-usage-web-arm64
