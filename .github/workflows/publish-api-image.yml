name: Publish API container image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-api-image.yml
      - .dockerignore
      - Dockerfile.server
      - go.mod
      - go.sum
      - cmd/codex-usage-api/**
      - cmd/codex-usage-backfill-patch-stats/**
      - docs/**
      - internal/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api-container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish codex-usage-api
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/codex-usage-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=codex-usage-api-arm64
          cache-to: type=gha,mode=max,scope=codex-usage-api-arm64
