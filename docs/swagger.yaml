info:
  contact: {}
  description: API for Codex usage ingestion, session browsing, usage reporting, and
    archive inspection.
  title: codex-usage API
  version: 0.1.0
paths:
  /api/archive/devices:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/archive.DeviceSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Archive devices
      tags:
      - Archive
  /api/archive/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/archive.Health'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Archive health
      tags:
      - Archive
  /api/archive/integrity:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/archive.IntegrityResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Archive integrity
      tags:
      - Archive
  /api/archive/repositories:
    get:
      parameters:
      - description: Maximum number of repositories
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/archive.RepositorySummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Archive repositories
      tags:
      - Archive
  /api/archive/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/archive.Status'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Archive status
      tags:
      - Archive
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          properties:
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Logout
      tags:
      - Auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Current user
      tags:
      - Auth
  /api/exports/sessions:
    get:
      parameters:
      - description: 'Export format: csv, json, or markdown'
        in: query
        name: format
        type: string
      - description: Maximum number of rows
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Sort key
        in: query
        name: sort
        type: string
      - description: Start date in YYYY-MM-DD format
        in: query
        name: from
        type: string
      - description: End date in YYYY-MM-DD format
        in: query
        name: to
        type: string
      - description: Device ID filter
        in: query
        name: deviceId
        type: string
      - description: Repository ID filter
        in: query
        name: repositoryId
        type: string
      - description: Project ID filter
        in: query
        name: projectId
        type: string
      - description: Branch filter
        in: query
        name: branch
        type: string
      - description: Model filter
        in: query
        name: model
        type: string
      - description: Text search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      - text/csv
      - text/markdown
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sessions.ListItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Export sessions
      tags:
      - Exports
  /api/filter-options:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/filteroptions.Result'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Filter options
      tags:
      - Filter Options
  /api/ingest/sessions:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: JSON-encoded ingest metadata array
        in: formData
        name: metadata
        required: true
        type: string
      - description: Raw JSONL file
        in: formData
        name: raw_0
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/ingest.BatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - DeviceTokenAuth: []
      summary: Ingest sessions
      tags:
      - Ingest
  /api/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/projects.ProjectSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List projects
      tags:
      - Projects
  /api/repositories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/projects.RepositorySummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List repositories
      tags:
      - Projects
  /api/search:
    get:
      parameters:
      - description: Text search query
        in: query
        name: q
        type: string
      - description: Maximum number of rows
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Set false to skip total count
        in: query
        name: includeTotal
        type: boolean
      - description: Start date in YYYY-MM-DD format
        in: query
        name: from
        type: string
      - description: End date in YYYY-MM-DD format
        in: query
        name: to
        type: string
      - description: Device ID filter
        in: query
        name: deviceId
